name: build
on: [push]

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup dev environment
        run: nix develop . --command sh -c 'echo "$PATH" >> "$GITHUB_PATH"'
      - name: Compile
        run: mill __.${{ matrix.platform }}.compile
      - name: Test
        run: |
          if [ "${{ matrix.platform }}" = "native" ]; then
            mill __.native.test
          else
            mill {common,dht,bittorrent,files}.jvm.test
          fi
      - name: Build distributable
        if: matrix.platform == 'jvm'
        run: mill cmd.jvm.assembly
      - name: Build native binary
        if: matrix.platform == 'native'
        run: mill cmd.native.nativeLink
      - name: Set up Docker Buildx
        id: buildx
        if: matrix.platform == 'jvm' || matrix.platform == 'native'
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: matrix.platform == 'jvm' || matrix.platform == 'native'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push cmd images
        if: matrix.platform == 'jvm'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: cmd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/torrentdam/cmd:latest
      - name: Extract metadata for cmd-native image
        id: meta-native
        if: matrix.platform == 'native'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/torrentdam/cmd-native
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Push cmd-native image
        if: matrix.platform == 'native'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/Dockerfile.native
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta-native.outputs.tags }}
          labels: ${{ steps.meta-native.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup dev environment
        run: nix develop . --command sh -c 'echo "$PATH" >> "$GITHUB_PATH"'
      - name: Release
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          export VERSION=${GITHUB_REF#*/v}
          echo Publishing $VERSION
          mill mill.javalib.SonatypeCentralPublishModule/
