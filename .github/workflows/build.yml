name: build
on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile
        run: ./mill __.${{ matrix.platform }}.compile
      - name: Test
        run: ./mill __.${{ matrix.platform }}.test
      - name: Build distributable
        if: matrix.platform == 'jvm'
        run: ./mill cmd.jvm.assembly
      - name: Build native binary
        if: matrix.platform == 'native'
        run: ./mill cmd.native.nativeLink
      - name: Set up Docker Buildx
        id: buildx
        if: matrix.platform == 'jvm'
        uses: docker/setup-buildx-action@master
      - name: Login to GitHub Container Registry
        if: matrix.platform == 'jvm'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push cmd images
        if: matrix.platform == 'jvm'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: cmd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/torrentdam/cmd:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Release
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          export VERSION=${GITHUB_REF#*/v}
          echo Publishing $VERSION
          ./mill mill.javalib.SonatypeCentralPublishModule/
